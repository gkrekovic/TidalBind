name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install GHCi for the transport integration test
        run: sudo apt-get update && sudo apt-get install -y ghc
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q
      - run: tidalbind examples/performance.tidal --dry-run --replay examples/replay.jsonl --missing-values defer
